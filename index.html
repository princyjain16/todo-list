<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                ✅ My To-Do List
            </span>
        </div>
    </nav>


    <!-- Main Container -->
    <div class="container my-5">

        <!-- Heading -->
        <div class="text-center mb-4">
            <h1>My To-Do List</h1>
            <p class="text-muted">
                Organize your tasks and manage your daily activities.
            </p>
        </div>


        <!-- Add Task Card -->
        <div class="card shadow mb-4">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add New Task</h4>
            </div>

            <div class="card-body">

                <div class="input-group">

                    <input
                        type="text"
                        id="taskInput"
                        class="form-control"
                        placeholder="Enter your task..."
                    >

                    <button
                        id="addTaskBtn"
                        class="btn btn-primary"
                    >
                        Add Task
                    </button>

                </div>

            </div>

        </div>


        <!-- Task Summary -->
        <div class="row text-center mb-4">

            <div class="col-md-4 mb-3">
                <div class="summary-card">
                    <h5>Total Tasks</h5>
                    <h2 id="totalTasks">0</h2>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="summary-card">
                    <h5>Completed</h5>
                    <h2 id="completedTasks">0</h2>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="summary-card">
                    <h5>Pending</h5>
                    <h2 id="pendingTasks">0</h2>
                </div>
            </div>

        </div>


        <!-- Task List -->
        <div class="card shadow">

            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">My Tasks</h4>
            </div>

            <div class="card-body">

                <ul id="taskList" class="list-group">

                </ul>

                <p
                    id="noTasks"
                    class="text-center text-muted mt-3"
                >
                    No tasks added yet.
                </p>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-5">

        <p class="mb-0">
            HTML To-Do List | Front-End Web Development Project
        </p>

    </footer>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>

</html>
